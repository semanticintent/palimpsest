<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Palimpsest card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root {
    --bg: #0b0d12;
    --ink: #f2f4f7;
    --body: #a7aebb;
    --quiet: #6b7280;
    --ember: #f97316;
    --rule: #1f242d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; background: var(--bg); }
  .card {
    width: 1080px; height: 1080px; padding: 120px 110px 96px;
    display: flex; flex-direction: column;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  .glyph { width: 168px; height: 168px; color: var(--ember); }
  h1 { margin-top: 64px; font-size: 104px; font-weight: 600; letter-spacing: -2.5px; line-height: 1; }
  .meaning { margin-top: 44px; font-size: 34px; line-height: 1.5; color: var(--body); max-width: 820px; }
  .meaning em { color: var(--ink); font-style: normal; }
  .spacer { flex: 1; }
  .repo {
    display: flex; align-items: center; gap: 22px;
    padding-top: 40px; border-top: 1.5px solid var(--rule);
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 30px; color: var(--ink);
  }
  .repo svg { width: 44px; height: 44px; color: var(--ink); flex: none; }
</style>
</head>
<body>
  <div class="card">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2.5 7H8M16 7h5.5"/>
      <path d="M2.5 12H4.75M19.25 12h2.25"/>
      <path d="M2.5 17H8M16 17h5.5"/>
      <circle cx="12" cy="12" r="6"/>
      <path d="M9 10h6M9 14h3.5"/>
    </svg>

    <h1>Palimpsest</h1>

    <p class="meaning">
      A page scraped and written over, where the older writing can still be read beneath the new.
      <em>Palimpsest reads an existing module the same way: back to what it was for, before anyone rebuilds it.</em>
    </p>

    <div class="spacer"></div>

    <div class="repo">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      github.com/semanticintent/palimpsest
    </div>
  </div>
</body>
</html>
